name: Triage outside pull requests

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  label:
    if: github.event.pull_request.user.login != 'srcurran'
    runs-on: ubuntu-latest
    steps:
      # This only updates PR metadata; never check out or run contributor code here.
      - name: Mark for maintainer triage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST \
            "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            -f 'labels[]=needs-triage' \
            --silent
